Global:
  device: gpu
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 100
  output_dir: /ghData/output/baseline
  eval_epoch_step: [0, 1]
  save_epoch_step: [0, 5]
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path /ghData/data/uyghur_dict.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char true
  save_res_path: /ghData/output/baseline/predicts.txt
  use_amp: true
  distributed: false
  seed: 42

Optimizer:
  name: AdamW
  lr: 0.000325
  weight_decay: 0.05
  filter_bias_and_bn: true

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 5
  cycle_momentum: false

Architecture:
  model_type: rec
  algorithm: SVTR
  Transform:
  Encoder:
    name: ViTLearnableFusionRSVP
    img_size: [32, 128]
    patch_size: [4, 4]
    last_stage: true
    feat2d: false
    component_kernel: 3
    context_dilation: 2
    enhancement_drop_rate: 0.1
    interaction_mode: baseline
    interaction_init: 0.1
    rsvp_init_alpha: 0.1
    last_drop: 0.1

  Decoder:
    name: CTCDecoder

Loss:
  name: CTCLoss
  zero_infinity: true

PostProcess:
  name: CTCLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc
  is_filter: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /ghData/data
    label_file_list:
      - /ghData/data/merged_labels.txt
      - /ghData/data/real_train-aug35.txt
    ratio_list: [0.5, 1.0]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecTVResize:
          image_shape: [32, 128]
          padding: false
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /ghData/data
    label_file_list:
      - /ghData/data/real_eval.txt
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecTVResize:
          image_shape: [32, 128]
          padding: false
      - KeepKeys:
          keep_keys: [image, label, length]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 4
    num_workers: 2
